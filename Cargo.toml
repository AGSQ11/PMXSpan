[package]
name = "pmxspan"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Standalone desktop manager for Proxmox VE clusters"
readme = "README.md"
publish = false

[[bin]]
name = "pmxspan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
base64 = "0.22"
bytes_crate = { version = "1.12.1", package = "bytes" }
chacha20poly1305 = "0.10"
chrono = "0.4.45"
directories = "6"
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
futures-util = "0.3.34"
hex = "0.4.3"
hyper = { version = "1", features = ["server", "http1"] }
ipnet = "2.12.2"
parking_lot = "0.13.0"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "multipart", "stream", "rustls-no-provider", "charset"] }
rfd = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs", "io-util", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
webbrowser = "1.2.5"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rand_core", "encryption"] }
zeroize = "1.8"
# MCP server (src/mcp): local, opt-in Streamable HTTP endpoint for AI assistants.
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "http1"] }
http-body-util = "0.1.5"
subtle = "2.6"

# In-app consoles (VNC viewer and terminal over Proxmox's vncwebsocket).
# The WebSocket runs on the connection reqwest already upgraded, so no TLS
# features (and no second TLS stack) are needed here.
tokio-tungstenite = { version = "0.30", default-features = false }
vnc-rs = "0.6"
vt100 = "0.18"
sha1 = "0.10"

# SSHSpan integration: the Windows registry (peer discovery, scheme probe)
# and ShellExecute (opening a registered sshspan:// link).

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
