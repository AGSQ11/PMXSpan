[package]
name = "proxmox-panel"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Standalone desktop manager for Proxmox VE clusters"
readme = "README.md"
publish = false

[[bin]]
name = "proxmoxpanel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
base64 = "0.22"
bytes_crate = { version = "1.12.1", package = "bytes" }
chacha20poly1305 = "0.10"
chrono = "0.4.45"
directories = "6"
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
futures-util = "0.3.34"
hex = "0.4.3"
hyper = "1"
ipnet = "2.12.2"
parking_lot = "0.13.0"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "multipart", "stream", "rustls-no-provider", "charset"] }
rfd = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
webbrowser = "1.2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
